components:
  responses:
    GenericError:
      description: Error (see the operation for the exact status).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { ok: false, error: example error }
    StoreNotConfigured:
      description: The local store is not configured on this instance (`CHITRAGUPTA_STORE_DIR` unset). Every `/api/*` endpoint except the blind Jev proxy returns this 503 in that state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: "CHITRAGUPTA_STORE_DIR is not set; copy .env.example to .env"
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: example error }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }
    Person:
      type: string
      enum: [household, zonito, nikhila]
      example: household
    CategoryDef:
      type: object
      required: [name, colour, icon, builtin]
      properties:
        name: { type: string, example: Groceries }
        colour:
          type: string
          description: Theme token, hex or oklch colour.
          example: "var(--cat-groceries)"
        icon: { type: string, example: shopping-basket }
        builtin: { type: boolean, example: true }
    AppSettings:
      type: object
      required:
        [
          availableFloorMinor,
          overallMonthlyBudgetMinor,
          categoryBudgets,
          jevEnabled,
          jevLastOutcome,
        ]
      properties:
        availableFloorMinor:
          type: integer
          nullable: true
          description: Available floor in minor units; null means no floor.
          example: 10000
        overallMonthlyBudgetMinor:
          type: integer
          nullable: true
          description: Overall monthly budget in minor units; null means no budget.
          example: 200000
        categoryBudgets:
          type: object
          description: Category name → monthly budget in minor units.
          additionalProperties: { type: integer }
          example: { Groceries: 40000 }
        jevEnabled:
          type: boolean
          description: Jev second opinions; on unless explicitly switched off.
          example: true
        jevLastOutcome:
          type: object
          nullable: true
          required: [status, at]
          properties:
            status: { type: string, enum: [ok, unavailable], example: ok }
            at: { type: string, example: "2026-11-01T08:00:00Z" }
    SettingsPatch:
      type: object
      description: Partial settings patch. Absent keys are untouched; explicit null clears.
      properties:
        availableFloorMinor:
          type: integer
          nullable: true
          minimum: 0
          example: 10000
        overallMonthlyBudgetMinor:
          type: integer
          nullable: true
          minimum: 0
          example: 200000
        categoryBudgets:
          type: object
          additionalProperties:
            type: integer
            nullable: true
            minimum: 0
          example: { Groceries: 40000 }
        jevEnabled: { type: boolean, example: true }
    ReviewQueueItem:
      type: object
      required: [merchant, count, examples, detail, suggestion]
      properties:
        merchant: { type: string, example: Example Groceries Ltd }
        count: { type: integer, example: 4 }
        examples:
          type: array
          items: { type: string }
          example: [Example Groceries Ltd]
        detail:
          type: string
          example: "£12.00 · 4 charges · last 1 Nov"
        suggestion:
          type: string
          nullable: true
          description: Category the app currently resolves for this merchant, or null when only the movement fallback resolves.
          example: Groceries
    ReviewQueueResponse:
      type: object
      required: [ok, queue, total]
      properties:
        ok: { type: boolean, example: true }
        queue:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQueueItem"
        total:
          type: integer
          description: True uncapped queue size (the queue list itself may be capped for display).
          example: 1
    IngestStatusResponse:
      type: object
      required: [ok, accounts, rebuilds]
      properties:
        ok: { type: boolean, example: true }
        accounts:
          type: array
          items:
            type: object
            required:
              [
                person,
                account,
                lastIngest,
                rowsSeen,
                rowsAdded,
                balanceMinor,
                currency,
                discrepancy,
              ]
            properties:
              person: { type: string, example: zonito }
              account: { type: string, example: Pro }
              lastIngest:
                type: string
                nullable: true
                example: "2026-11-01T08:00:00Z"
              rowsSeen: { type: integer, example: 120 }
              rowsAdded: { type: integer, example: 3 }
              balanceMinor:
                type: integer
                nullable: true
                description: Balance in minor units in its own currency; null when the run recorded none (unknown, never £0).
                example: 123456
              currency:
                type: string
                nullable: true
                example: GBP
              discrepancy:
                type: string
                nullable: true
                example: null
        rebuilds:
          type: array
          items:
            type: object
            required: [at, discrepancy]
            properties:
              at:
                type: string
                nullable: true
                example: "2026-11-01T08:00:00Z"
              discrepancy:
                type: string
                nullable: true
                example: null
    IngestResult:
      type: object
      required:
        [
          person,
          account,
          rowsSeen,
          rowsAdded,
          balanceMinor,
          currency,
          discrepancy,
          ok,
          file,
        ]
      properties:
        person: { type: string, example: zonito }
        account: { type: string, example: Pro }
        rowsSeen: { type: integer, example: 120 }
        rowsAdded: { type: integer, example: 3 }
        balanceMinor:
          type: integer
          nullable: true
          example: 123456
        currency:
          type: string
          nullable: true
          example: GBP
        discrepancy:
          type: string
          nullable: true
          example: null
        ok:
          type: boolean
          description: False when this account's source file could not be read or parsed.
          example: true
        file:
          type: string
          nullable: true
          description: The Originals file this account reads (basename), or null when none could be named.
          example: example-statement.csv
        error:
          type: string
          description: Failure detail when `ok` is false.
          example: no transactions parsed
    GatewayStatus:
      type: object
      required: [attempted, ok, provider]
      properties:
        attempted: { type: boolean, example: false }
        ok: { type: boolean, example: false }
        provider:
          type: string
          nullable: true
          description: Gateway provider name, or null when no call was attempted. (Provider spellings are owned by `src/lib/muse.server.ts`.)
          example: null
        status:
          type: integer
          description: HTTP status of the gateway call, when one was attempted.
          example: 200
        error:
          type: string
          description: Short gateway error excerpt (keys redacted), on failure.
          example: example gateway error
    ClassifySummary:
      type: object
      required: [ran, classified, failed, remaining, gateway]
      properties:
        ran: { type: boolean, example: false }
        reason:
          type: string
          description: Why nothing ran, when `ran` is false.
          example: "No gateway API key is set (OPENCODE_API_KEY or MUSE_API_KEY); staying rules-only"
        classified: { type: integer, example: 0 }
        failed: { type: integer, example: 0 }
        remaining: { type: integer, example: 2 }
        gateway:
          $ref: "#/components/schemas/GatewayStatus"
    ClassifySummaryResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponse"
        - $ref: "#/components/schemas/ClassifySummary"
    IngestRunResponse:
      type: object
      required: [ok, results, classification]
      properties:
        ok:
          type: boolean
          description: False on partial failure (the HTTP status stays 200 — documented as-is).
          example: true
        error:
          type: string
          description: Present when `ok` is false — names the failed accounts.
          example: "1 of 4 accounts failed: Pro (example-statement.csv): no transactions parsed"
        results:
          type: array
          items:
            $ref: "#/components/schemas/IngestResult"
        classification:
          nullable: true
          description: Classification summary, or null when the classification drain itself failed (never fails the ingest).
          allOf:
            - $ref: "#/components/schemas/ClassifySummary"
    MerchantSetRequest:
      type: object
      required: [merchant, category]
      properties:
        merchant: { type: string, example: Example Groceries Ltd }
        category: { type: string, example: Groceries }
        colour:
          type: string
          nullable: true
          example: null
        icon:
          type: string
          nullable: true
          example: null
        source:
          type: string
          description: One of rules, claude-api, molang, user. Absent or unrecognised values default to molang.
          example: user
    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          example: Example Category
        colour:
          type: string
          nullable: true
          description: Hex, oklch() or var(--token). Omitted/null/empty hands out the next custom palette colour.
          example: "oklch(0.52 0.14 320)"
        icon:
          type: string
          nullable: true
          description: One of the shared category icon names. Omitted/null/empty defaults to tag.
          example: tag
    TransactionRow:
      type: object
      required:
        [
          id,
          person,
          account,
          date,
          month,
          description,
          merchant,
          amountMinor,
          currency,
          movement,
          category,
          userNote,
        ]
      properties:
        id:
          type: string
          description: Transaction fingerprint.
          example: example-fingerprint-1
        person: { type: string, example: zonito }
        account: { type: string, example: Pro }
        date:
          type: string
          description: Effective timestamp as stored (for example "2026-11-01 09:30:00"; the exact separator comes from the stored value).
          example: "2026-11-01 09:30:00"
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-11"
        description: { type: string, example: Example Groceries Ltd }
        merchant: { type: string, example: Example Groceries Ltd }
        amountMinor:
          type: integer
          description: Signed minor units in the row's own currency (negative is money out).
          example: -1200
        currency: { type: string, example: GBP }
        movement:
          type: string
          description: Store movement (for example spend, income, aside, transfer — spellings owned by the ingest layer).
          example: spend
        category:
          type: string
          description: Resolved category (explicit category, else merchant memory, else movement fallback).
          example: Groceries
        userNote:
          type: string
          nullable: true
          example: null
    TransactionsResponse:
      type: object
      required: [ok, count, transactions]
      properties:
        ok: { type: boolean, example: true }
        count: { type: integer, example: 1 }
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionRow"
    AccountsResponse:
      type: object
      required: [ok, month, accounts]
      properties:
        ok: { type: boolean, example: true }
        month:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: Display month (YYYY-MM), or null when the store has no transactions.
          example: "2026-11"
        accounts:
          type: array
          items:
            type: object
            required:
              [
                person,
                account,
                balanceSource,
                spend,
                moneyIn,
                topCategories,
                biggest,
              ]
            properties:
              person: { type: string, example: zonito }
              account: { type: string, example: Pro }
              balanceSource:
                type: string
                nullable: true
                enum: [statement, derived, null]
                description: Provenance of the balance the client joins from the snapshot.
                example: statement
              spend:
                type: object
                description: Minor units spent in the display month, keyed by currency code — per currency, never summed together.
                additionalProperties: { type: integer }
                example: { GBP: 1200 }
              moneyIn:
                type: object
                description: Minor units in (income/interest) in the display month, keyed by currency code.
                additionalProperties: { type: integer }
                example: { GBP: 100000 }
              topCategories:
                type: array
                description: Top 3 GBP categories by spend.
                items:
                  type: object
                  required: [category, spend_minor]
                  properties:
                    category: { type: string, example: Groceries }
                    spend_minor: { type: integer, example: 1200 }
              biggest:
                type: object
                nullable: true
                required: [merchant, amount_minor, currency, date]
                properties:
                  merchant: { type: string, example: Example Groceries Ltd }
                  amount_minor:
                    type: integer
                    description: Absolute minor units in its own currency.
                    example: 1200
                  currency: { type: string, example: GBP }
                  date: { type: string, example: "2026-11-01" }
    AggregatesLegacyResponse:
      type: object
      required: [ok, person, month, rows, otherCurrencies]
      properties:
        ok: { type: boolean, example: true }
        person: { $ref: "#/components/schemas/Person" }
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-11"
        rows:
          type: array
          description: GBP rows only.
          items:
            type: object
            required:
              [category, spend_minor, income_minor, aside_minor, txn_count]
            properties:
              category: { type: string, example: Groceries }
              spend_minor: { type: integer, example: 1200 }
              income_minor: { type: integer, example: 0 }
              aside_minor: { type: integer, example: 0 }
              txn_count: { type: integer, example: 1 }
        otherCurrencies:
          type: array
          description: Non-GBP totals, one row per currency — never mixed into the GBP rows.
          items:
            type: object
            required: [currency, spend, income, aside, txns]
            properties:
              currency: { type: string, example: EUR }
              spend: { type: integer, example: 500 }
              income: { type: integer, example: 0 }
              aside: { type: integer, example: 0 }
              txns: { type: integer, example: 1 }
    AggregatesScopedResponse:
      type: object
      required:
        [ok, person, scope, total_minor, seriesPeriods, seriesLabels, rows]
      properties:
        ok: { type: boolean, example: true }
        person: { $ref: "#/components/schemas/Person" }
        scope: { type: string, enum: [month, year, all], example: month }
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: "Present with scope: month."
          example: "2026-11"
        year:
          type: string
          pattern: '^\d{4}$'
          description: "Present with scope: year."
          example: "2026"
        total_minor:
          type: number
          description: Whole weighted GBP spend in scope, including spend whose category folds outside the category list (which `rows` omit). Can carry a half.
          example: 1200
        seriesPeriods:
          type: array
          items: { type: string }
          example: ["2026-06", "2026-11"]
        seriesLabels:
          type: array
          items: { type: string }
          example: [Jun, Nov]
        rows:
          type: array
          items:
            type: object
            required: [category, spend_minor, typical_minor, series]
            properties:
              category: { type: string, example: Groceries }
              spend_minor:
                type: number
                description: Weighted minor units; can carry a half (a halved odd Joint row).
                example: 1200
              typical_minor:
                type: number
                nullable: true
                description: '"Usually": median of the prior 6 months (month scope), median of other years (year scope, needs ≥2 other years), else null.'
                example: 1000
              series:
                type: array
                items: { type: number }
                example: [0, 1200]
        category:
          type: string
          description: Present when a `category` drill-down was requested.
          example: Groceries
        merchants:
          type: array
          description: Present with `category` — per-merchant weighted spend in that category within the scope, sorted descending.
          items:
            type: object
            required: [merchant, spend_minor]
            properties:
              merchant: { type: string, example: Example Groceries Ltd }
              spend_minor: { type: number, example: 1200 }
    AggregatesDailyResponse:
      type: object
      required: [ok, person, days, start, end, dataStart, buckets]
      properties:
        ok: { type: boolean, example: true }
        person: { $ref: "#/components/schemas/Person" }
        days: { type: integer, example: 30 }
        start:
          type: string
          nullable: true
          format: date
          example: "2026-10-03"
        end:
          type: string
          nullable: true
          format: date
          example: "2026-11-01"
        dataStart:
          type: string
          nullable: true
          format: date
          description: First transaction date in the store.
          example: "2026-01-01"
        buckets:
          type: array
          items:
            type: object
            required: [date, total_minor, categories]
            properties:
              date: { type: string, format: date, example: "2026-11-01" }
              total_minor: { type: integer, example: 1200 }
              categories:
                type: object
                description: Category name → GBP spend in minor units that day.
                additionalProperties: { type: integer }
                example: { Groceries: 1200 }
    DigestResponse:
      type: object
      required:
        [
          ok,
          week,
          month,
          byMonth,
          weekTransactions,
          upcomingRegulars,
          oneOffs,
          movedAsideTotal,
          movedAsideForeign,
          unclassifiedMerchants,
        ]
      properties:
        ok: { type: boolean, example: true }
        week: { type: string, example: "2026-W44" }
        month:
          type: string
          description: Month (YYYY-MM) of the week's ISO Monday.
          example: "2026-10"
        byMonth:
          type: array
          description: Per-person month aggregates (household rows excluded by contract). Minor units, GBP rows.
          items:
            type: object
            required: [person, category, spend, income, aside, txns]
            properties:
              person: { type: string, example: zonito }
              category: { type: string, example: Groceries }
              spend: { type: integer, example: 1200 }
              income: { type: integer, example: 0 }
              aside: { type: integer, example: 0 }
              txns: { type: integer, example: 1 }
        weekTransactions:
          type: array
          description: Up to 200 transactions in the week, newest first. Amounts are signed minor units in each row's own currency.
          items:
            type: object
            required:
              [
                effective_date,
                description,
                merchant,
                amount_minor,
                currency,
                movement,
                category,
              ]
            properties:
              effective_date: { type: string, example: "2026-11-01 09:30:00" }
              description: { type: string, example: Example Groceries Ltd }
              merchant: { type: string, example: Example Groceries Ltd }
              amount_minor: { type: integer, example: -1200 }
              currency: { type: string, example: GBP }
              movement: { type: string, example: spend }
              category:
                type: string
                nullable: true
                example: Groceries
        upcomingRegulars:
          type: array
          description: Merchants with ≥3 spend charges, most frequent first (up to 20). Amounts are per currency only in aggregate here — `avg_minor` averages the merchant's own rows as stored.
          items:
            type: object
            required: [merchant, category, times, avg_minor]
            properties:
              merchant: { type: string, example: Example Subscription }
              category:
                type: string
                nullable: true
                example: Subscriptions
              times: { type: integer, example: 4 }
              avg_minor:
                type: number
                description: Average charge magnitude in minor units (SQL AVG, so a float).
                example: 999.0
        oneOffs:
          type: array
          description: The month's largest one-off spends (≤ −£250.00), up to 50.
          items:
            type: object
            required:
              [effective_date, description, merchant, amount_minor, currency]
            properties:
              effective_date: { type: string, example: "2026-11-01 09:30:00" }
              description: { type: string, example: Example One-off }
              merchant: { type: string, example: Example One-off }
              amount_minor: { type: integer, example: -25000 }
              currency: { type: string, example: GBP }
        movedAsideTotal:
          type: integer
          description: GBP moved-aside total for the month, minor units.
          example: 0
        movedAsideForeign:
          type: array
          description: Non-GBP moved-aside totals, one row per currency — never added into `movedAsideTotal`.
          items:
            type: object
            required: [currency, total]
            properties:
              currency: { type: string, example: EUR }
              total: { type: integer, example: 500 }
        unclassifiedMerchants:
          type: array
          items:
            type: object
            required: [merchant, n]
            properties:
              merchant: { type: string, example: Example Groceries Ltd }
              n: { type: integer, example: 4 }
    AskFigures:
      type: object
      required: [total, count, latest, perMonth, month, truncated]
      properties:
        total:
          type: number
          description: Total of the matched spend set, in pounds, scoped to the person via shareOf.
          example: 12.0
        count: { type: integer, example: 1 }
        latest:
          type: object
          nullable: true
          required: [merchant, date, amount]
          properties:
            merchant: { type: string, example: Example Groceries Ltd }
            date: { type: string, example: "2026-11-01" }
            amount: { type: number, example: 12.0 }
        perMonth:
          type: array
          nullable: true
          description: Present only when the matched set spans months.
          items:
            type: object
            required: [month, total, count]
            properties:
              month: { type: string, example: "2026-10" }
              total: { type: number, example: 12.0 }
              count: { type: integer, example: 1 }
        month:
          type: string
          nullable: true
          description: YYYY-MM when the question named a month, else null.
          example: "2026-10"
        truncated:
          type: boolean
          description: True only when the pull ceiling actually cut the set (totals are then a floor).
          example: false
        top:
          type: array
          nullable: true
          description: Present only for "top" answers — the largest matching spends, biggest first.
          items:
            type: object
            required: [merchant, date, amount]
            properties:
              merchant: { type: string, example: Example Groceries Ltd }
              date: { type: string, example: "2026-11-01" }
              amount: { type: number, example: 12.0 }
    AskResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponse"
        - type: object
          required: [answer, figures, ai, gateway]
          properties:
            answer:
              {
                type: string,
                example: "You spent £12.00 on groceries last month across 1 transaction.",
              }
            figures:
              $ref: "#/components/schemas/AskFigures"
            ai:
              type: boolean
              description: True when a model wrote the prose; false for the deterministic answer.
              example: false
            gateway:
              $ref: "#/components/schemas/GatewayStatus"
    JevOpinion:
      type: object
      required: [answers, at, cached]
      properties:
        answers:
          type: object
          description: Question key → chosen answer (each one of the choices offered for that key).
          additionalProperties: { type: string }
          example: { posture: "Hold steady" }
        at:
          type: string
          description: ISO time of the live call that produced the answers.
          example: "2026-11-01T08:00:00Z"
        cached: { type: boolean, example: true }
    JevOpinionResponse:
      type: object
      required: [ok, jev]
      properties:
        ok: { type: boolean, example: true }
        jev:
          nullable: true
          description: Null means "render nothing" (Jev off, nothing to say, or down with nothing cached).
          allOf:
            - $ref: "#/components/schemas/JevOpinion"
    JevPayload:
      type: object
      description: "Upstream Varuna Jev request shape, forwarded verbatim by the proxy."
      required: [state, questions]
      properties:
        state:
          type: object
          description: Computed facts only (merchant/category names and figures — never raw statement rows, balances or account identifiers).
          additionalProperties: true
          example: { example_fact_gbp: 12.0 }
        questions:
          type: object
          additionalProperties:
            type: object
            required: [question, choices]
            properties:
              question:
                { type: string, example: "Which posture fits best right now?" }
              choices:
                type: array
                items: { type: string }
                example: ["Hold steady", "Ease off"]
        model: { type: string, example: jev-latest }
    Doc:
      type: object
      required: [id, merchant, date, amount, type, path]
      properties:
        id: { type: string, example: 00000000-0000-4000-8000-000000000001 }
        merchant: { type: string, example: Example Groceries Ltd }
        date:
          type: string
          description: Display date label (for example "1 Nov 2026"), as served by the snapshot — not ISO.
          example: 1 Nov 2026
        amount:
          type: number
          description: Pounds.
          example: 12.0
        type:
          type: string
          enum: [Receipt, Bill, Invoice, Warranty]
          example: Receipt
        txnId:
          type: string
          description: Present only when linked to a transaction.
          example: example-fingerprint-1
        matchedLine:
          type: string
          description: Present on snapshot-matched documents only.
        path:
          type: string
          description: Data-dir-relative path prefixed with PersonalFinance/.
          example: "PersonalFinance/Documents/Receipts/2026/2026-11/2026-11-01_ExampleGroceriesLtd_£12.00.pdf"
        warrantyEnds:
          type: string
          description: Present only when a warranty end date was recorded.
          example: "2028-11-01"
        owner:
          type: string
          enum: [zonito, nikhila, joint]
    DocumentCreateRequest:
      type: object
      required: [filename, contentBase64, type, merchant, date, amount]
      properties:
        filename:
          type: string
          description: Extension must be pdf, jpg, jpeg or png.
          example: example-receipt.pdf
        contentBase64:
          type: string
          format: byte
          description: Base64 file bytes. Must decode to 1 byte – 10 MB.
          example: JVBERi0xLjQK
        type:
          type: string
          enum: [Receipt, Bill, Invoice, Warranty]
          example: Receipt
        merchant: { type: string, example: Example Groceries Ltd }
        date:
          type: string
          format: date
          description: Real calendar date, YYYY-MM-DD.
          example: "2026-11-01"
        amount:
          type: number
          description: Pounds (not minor units — see the operation description).
          example: 12.0
        txnId:
          type: string
          nullable: true
          description: Transaction fingerprint to link to. Absent/empty files the document unmatched.
          example: example-fingerprint-1
        warrantyEnds:
          type: string
          nullable: true
          example: "2028-11-01"
